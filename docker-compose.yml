services:
  mongodb:
    image: mongo:8.3
    container_name: franchise-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: franchise_db
    volumes:
      - mongodb_data:/data/db

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: franchise-managment-api
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/franchise_db


volumes:
  mongodb_data: